# The docker-compose file. Acts as the "project manager". Responsible for orchestrating the application containers

services: # Definitions for all services/containers
  app: # First container - The application container
    build: ./app # Instructs Docker to build the image from the Dockerfile located in this directory
    env_file: # Load environment variables (like the username) from a specific file
      - .env
    volumes: # Mounts the local file to the container, acting as shared storage (the "fridge")
      - ./inventory.txt:/data/inventory.txt
    expose: # Exposes the port on the internal Docker network so the proxy can communicate with the app
      - "5000"

  proxy: # Second container - The proxy container (using a pre-built external image)
    image: nginx:alpine # Pulls a pre-built Nginx image instead of building a new one
    ports: # Port mapping to the outside world. Host port (left) mapped to container port (right)
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf # Overrides the default Nginx configuration with our custom config
      - ./dashboard:/usr/share/nginx/html # Mounts the Dashboard directory to the Nginx web root to serve the HTML files
    depends_on: # Defines startup order. Tells Docker to wait for the 'app' service to be running before starting the proxy
      - app
