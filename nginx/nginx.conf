# The "brain" of the proxy server. Its role is to act as a single point of entry.
# Instead of the user needing to know how to reach the app (port 5000) and the dashboard separately, 
# they simply access port 80 and the proxy routes the request accordingly.

server {
    listen 80; # The proxy server listens on port 80

    location / { # Defines the routing for the root path (e.g., localhost)
        root /usr/share/nginx/html; # Instructs the proxy where the static files (HTML) are located
        index index.html; # Serves index.html as the default file if no specific file is requested
    }

    location /api { # Defines the routing for requests to the /api endpoint
        proxy_pass http://app:5000/api; # Forwards the request to the backend 'app' service instead of serving a local file
        proxy_set_header Host $host; # Forwards the original host information to the backend
        proxy_set_header X-Real-IP $remote_addr; # Forwards the real client IP so the app knows the actual requester, rather than just seeing the proxy
    }
}